<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>出退勤スキャナー</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --in-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --out-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --success-color: #28a745;
      --error-color: #dc3545;
      --text-main: #222222;
      --text-sub: #666666;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { 
      margin: 0; padding: 0; height: 100%; width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden; 
      background: #f0f2f5; 
    }
    
    .app-container { 
      width: 100%; height: 100%; 
      display: flex; flex-direction: column; 
      padding: env(safe-area-inset-top, 10px) 10px env(safe-area-inset-bottom, 10px);
      box-sizing: border-box;
    }

    #menu-view { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      height: 100%; 
      gap: 12px; 
    }

    /* 1. 時計エリア */
    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5px 0 0;
      flex-shrink: 0;
    }
    .clock-date {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      margin-bottom: -2px;
    }
    .clock-time-wrap {
      display: flex;
      align-items: baseline;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }
    .clock-time {
      font-size: clamp(84px, 24vw, 112px);
      font-weight: 300;
      color: var(--text-main);
      line-height: 1;
      letter-spacing: -2px;
    }
    .clock-sec {
      font-size: clamp(34px, 9vw, 44px);
      font-weight: 400;
      color: var(--text-sub);
      margin-left: 6px;
      line-height: 1;
    }

    /* 2. ボタンエリア（正方形サイズ） */
    .button-container { 
      display: flex; 
      gap: 12px; 
      flex-shrink: 0;
    }
    .btn-main { 
      flex: 1; 
      aspect-ratio: 1 / 1; 
      border: none; 
      border-radius: 24px; 
      font-size: 34px; 
      font-weight: bold; 
      color: white; 
      cursor: pointer; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      box-shadow: 0 8px 15px rgba(0,0,0,0.15); 
      transition: transform 0.1s; 
    }
    #btn-in { background: var(--in-gradient); }
    #btn-out { background: var(--out-gradient); }
    .btn-main:active { transform: scale(0.95); }
    .btn-main small { font-size: 15px; font-weight: bold; margin-top: 4px; opacity: 0.9; }

    /* 3. 連絡事項エリア */
    .bottom-section { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      min-height: 0;
    }
    .announcement-container { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      background: white; 
      border-radius: 20px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
      overflow: hidden; 
    }
    .header-label { 
      padding: 12px 16px; 
      background: #f8f9fa; 
      font-size: 12px; 
      font-weight: bold; 
      color: #999; 
      border-bottom: 1px solid #eee; 
    }
    #announcement-text { 
      flex: 1; 
      padding: 20px; 
      font-size: 18px; 
      line-height: 1.6; 
      color: #333; 
      overflow-y: auto; 
      white-space: pre-wrap; 
      -webkit-overflow-scrolling: touch;
    }

    /* オーバーレイ画面（スキャン・手入力） */
    .overlay-view { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; background: #000; z-index: 100; }
    #video-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    #manual-view { background: #f0f2f5; justify-content: center; align-items: center; padding: 20px; }
    .manual-card { background: white; padding: 30px; border-radius: 24px; width: 85%; max-width: 320px; text-align: center; }
    #input-id { width: 100%; font-size: 44px; text-align: center; padding: 12px; border: 2px solid #eee; border-radius: 16px; margin: 20px 0; }
    .btn-ok { width: 100%; padding: 16px; font-size: 22px; font-weight: bold; color: white; background: #28a745; border: none; border-radius: 16px; cursor: pointer; }
    .btn-cancel { height: 85px; background: #444; border: none; color: white; font-size: 20px; font-weight: bold; flex-shrink: 0; }
    #overlay-msg { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); color: white; font-size: 18px; text-align: center; background: rgba(0,0,0,0.75); padding: 12px 30px; border-radius: 50px; width: 80%; pointer-events: none; }
    #error-log { display: none; position: fixed; top: 10px; right: 10px; background: var(--error-color); color: white; padding: 10px 15px; border-radius: 10px; font-size: 12px; font-weight: bold; z-index: 10001; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    #blackout-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 9999; }
    body.success-flash { background-color: var(--success-color) !important; }
    .success-msg { color: #fff; font-size: 28px; font-weight: bold; }
  </style>
</head>
<body onmousedown="handleUserInteraction()" ontouchstart="handleUserInteraction()">

  <div id="error-log">⚠️ 送信エラーが発生しました！<br>管理者へ報告してください。</div>
  <div id="blackout-overlay" onclick="resetIdleTimer()"></div>

  <div class="app-container">
    <div id="menu-view">
      <!-- 1. 時計表示エリア -->
      <div class="clock-container">
        <div id="clock-date" class="clock-date">----年--月--日 (--)</div>
        <div class="clock-time-wrap">
          <div id="clock-time" class="clock-time">--:--</div>
          <div id="clock-sec" class="clock-sec">--</div>
        </div>
      </div>

      <!-- 2. ボタンエリア（正方形） -->
      <div class="button-container">
        <button id="btn-in" class="btn-main" onclick="openScanner('出勤')">出勤<br><small>Clock In</small></button>
        <button id="btn-out" class="btn-main" onclick="openScanner('退勤')">退勤<br><small>Clock Out</small></button>
      </div>

      <!-- 3. 連絡事項エリア -->
      <div class="bottom-section">
        <div class="announcement-container">
          <div class="header-label">📢 連絡事項</div>
          <div id="announcement-text">読み込み中...</div>
        </div>
      </div>
    </div>

    <!-- スキャン画面 -->
    <div id="scan-view" class="overlay-view">
      <div id="video-container">
        <video id="video" playsinline></video>
        <div id="overlay-msg">QRコードをスキャン</div>
      </div>
      <button class="btn-cancel" onclick="closeScanner(true)">キャンセル</button>
    </div>

    <!-- 手入力画面 -->
    <div id="manual-view" class="overlay-view">
      <div class="manual-card" id="manual-card-inner">
        <h3 style="margin:0; color:#666;">IDを手入力</h3>
        <input type="tel" id="input-id" maxlength="4" placeholder="0000" onkeyup="if(event.key==='Enter') submitManual()">
        <button class="btn-ok" onclick="submitManual()">打刻する</button>
      </div>
      <div style="height: 30px;"></div>
      <button class="btn-cancel" onclick="closeScanner(true)">キャンセルして戻る</button>
    </div>
  </div>

  <!-- 音声ファイル（srcに実際のURLを入れてください） -->
  <audio id="sound-success" src="https://example.com/success.mp3" preload="auto"></audio>
  <audio id="sound-in" src="https://example.com/in.mp3" preload="auto"></audio>
  <audio id="sound-out" src="https://example.com/out.mp3" preload="auto"></audio>
  <audio id="sound-cancel" src="https://example.com/cancel.mp3" preload="auto"></audio>
  <audio id="sound-timeout" src="https://example.com/timeout.mp3" preload="auto"></audio>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyG7mJpGfICYUt39gubjT8o2fEqBlXkns0kD261BGf8N1g2w0BtzYLy2TLBwW1F_zNj/exec";
    const IDLE_TIME = 180000;
    let currentMode = '', isProcessing = false, videoStream = null, scanTimer = null, wakeLock = null, idleTimer = null;
    let isMotionSensorInitialized = false;
    let lastAcc = null;
    const MOTION_THRESHOLD = 3.2;
    
    const video = document.getElementById('video'), overlayMsg = document.getElementById('overlay-msg'), announceArea = document.getElementById('announcement-text'), inputId = document.getElementById('input-id'), blackout = document.getElementById('blackout-overlay'), errorLog = document.getElementById('error-log');
    const clockDate = document.getElementById('clock-date'), clockTime = document.getElementById('clock-time'), clockSec = document.getElementById('clock-sec');

    const sounds = {
      success: document.getElementById('sound-success'),
      in: document.getElementById('sound-in'),
      out: document.getElementById('sound-out'),
      cancel: document.getElementById('sound-cancel'),
      timeout: document.getElementById('sound-timeout')
    };

    // 時計の更新処理
    const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
    function updateClock() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const day = dayNames[now.getDay()];
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      clockDate.textContent = `${year}年 ${month}月 ${date}日 (${day})`;
      clockTime.textContent = `${hours}:${minutes}`;
      clockSec.textContent = seconds;
    }
    setInterval(updateClock, 1000);

    // 加速度センサー（持ち上げ検知）のハンドラ
    function handleDeviceMotion(event) {
      const acc = event.accelerationIncludingGravity || event.acceleration;
      if (!acc) return;
      if (lastAcc) {
        const delta = Math.abs(acc.x - lastAcc.x) + Math.abs(acc.y - lastAcc.y) + Math.abs(acc.z - lastAcc.z);
        if (delta > MOTION_THRESHOLD) {
          resetIdleTimer();
        }
      }
      lastAcc = { x: acc.x, y: acc.y, z: acc.z };
    }

    // 初回操作時にセンサー待受を開始
    function initMotionSensor() {
      if (isMotionSensorInitialized) return;
      isMotionSensorInitialized = true;
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('devicemotion', handleDeviceMotion);
            }
          })
          .catch(e => console.log("Motion sensor permission skip/denied", e));
      } else {
        window.addEventListener('devicemotion', handleDeviceMotion);
      }
    }

    function handleUserInteraction() {
      initMotionSensor();
      resetIdleTimer();
    }

    async function loadAnnouncement() {
      try {
        const response = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "getAnnouncement" }) });
        const res = await response.json();
        if (res.success) announceArea.innerText = res.message;
      } catch (err) { console.error("Load announcement failed", err); }
    }

    async function requestWakeLock() { if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} } }
    
    function resetIdleTimer() { 
      if(blackout) blackout.style.display = 'none'; 
      clearTimeout(idleTimer); 
      if (document.getElementById('menu-view').style.display !== 'none') { 
        idleTimer = setTimeout(() => { if(blackout) blackout.style.display = 'block'; }, IDLE_TIME); 
      } 
    }

    window.onload = () => { 
      updateClock(); 
      loadAnnouncement(); 
      resetIdleTimer(); 
      requestWakeLock(); 
    };
    
    function unlockAudio() {
      Object.values(sounds).forEach(s => {
        if (s && s.play) { s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(e => console.log("Unlock skip", e)); }
      });
    }

    async function openScanner(mode) {
      currentMode = mode; isProcessing = false;
      document.body.classList.remove('success-flash');
      unlockAudio();
      if (mode === '出勤' && sounds.in) sounds.in.play().catch(() => {});
      if (mode === '退勤' && sounds.out) sounds.out.play().catch(() => {});
      requestWakeLock();
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('menu-view').style.display = 'none';
        document.getElementById('scan-view').style.display = 'flex';
        overlayMsg.innerText = mode + "QRをスキャン中...";
        video.srcObject = videoStream; video.play(); requestAnimationFrame(tick);
        scanTimer = setTimeout(() => {
          if (sounds.timeout) sounds.timeout.play().catch(() => {});
          overlayMsg.innerHTML = `<span style="color:#ffc107">タイムアウトしました。<br>メニュー画面に戻ります。</span>`;
          setTimeout(closeScanner, 2000);
        }, 30000);
      } catch (err) {
        document.getElementById('menu-view').style.display = 'none';
        document.getElementById('manual-view').style.display = 'flex';
        if(inputId) { inputId.value = ""; inputId.focus(); }
      }
    }

    function closeScanner(isManualCancel = false) {
      if (isManualCancel && sounds.cancel) sounds.cancel.play().catch(() => {});
      if (scanTimer) clearTimeout(scanTimer);
      if (wakeLock) wakeLock.release().then(() => wakeLock = null).catch(()=>{});
      if (videoStream) { videoStream.getTracks().forEach(track => track.stop()); videoStream = null; }
      document.getElementById('menu-view').style.display = 'flex';
      document.getElementById('scan-view').style.display = 'none';
      document.getElementById('manual-view').style.display = 'none';
      document.body.classList.remove('success-flash');
      loadAnnouncement(); resetIdleTimer();
    }

    function tick() {
      if (video && video.readyState === video.HAVE_ENOUGH_DATA && !isProcessing && document.getElementById('scan-view').style.display === 'flex') {
        const canvas = document.createElement('canvas');
        canvas.height = video.videoHeight; canvas.width = video.videoWidth;
        const ctx = canvas.getContext('2d'); ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
        if (code && /^\d{4}$/.test(code.data)) { isProcessing = true; if (scanTimer) clearTimeout(scanTimer); handleScan(code.data); return; }
      }
      if (!isProcessing && document.getElementById('scan-view').style.display === 'flex') requestAnimationFrame(tick);
    }

    function submitManual() {
      const val = inputId.value;
      if (/^\d{4}$/.test(val)) { isProcessing = true; handleScan(val, true); } else { alert("4桁の数字を入力してください。"); }
    }

    async function handleScan(staffId, isManual = false) {
      if (sounds.success) sounds.success.play().catch(() => {});
      document.body.classList.add('success-flash');
      if (isManual) {
        document.getElementById('manual-card-inner').innerHTML = `<div class="success-msg" style="color:#28a745">ID:${staffId}<br>記録中...</div>`;
        try {
          const res = await fetch(GAS_URL, { method: "POST", mode: "cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ staffId: staffId, type: currentMode }) }).then(r => r.json());
          if (res.success) {
            document.getElementById('manual-card-inner').innerHTML = `<div class="success-msg" style="color:#28a745">ID:${staffId}<br>${res.status}完了！</div>`;
            setTimeout(() => { location.reload(); }, 2000);
          } else { throw new Error(res.message); }
        } catch (err) { alert("送信失敗: " + err.message); location.reload(); }
      } else {
        overlayMsg.innerHTML = `<span class="success-msg">ID:${staffId}<br>受付完了！</span>`;
        fetch(GAS_URL, { method: "POST", mode: "cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ staffId: staffId, type: currentMode }) })
        .then(r => r.json())
        .then(res => { if (!res.success) throw new Error(); })
        .catch(err => { if(errorLog) errorLog.style.display = 'block'; });
        setTimeout(() => { closeScanner(); isProcessing = false; }, 1200);
      }
    }
  </script>
</body>
</html>
